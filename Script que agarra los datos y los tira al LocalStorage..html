<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar | Barbería Urbana Conce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">URBANA CONCE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="cortes.html">Cortes y Precios</a></li>
                    <li class="nav-item"><a class="nav-link text-warning active" href="reservar.html">Reservar Hora</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="admin.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="text-warning mb-4">Agenda tu corte</h3>
                
                <form id="formReserva" class="bg-black p-4 border border-secondary rounded">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" id="nombreCliente" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">¿Qué te vas a hacer?</label>
                        <select id="tipoServicio" class="form-select bg-dark text-light border-secondary">
                            <option value="Corte Tradicional">Corte Tradicional - $10.000</option>
                            <option value="Perfilado Barba">Perfilado de Barba - $7.000</option>
                            <option value="Degradado + Barba">Degradado + Barba - $15.000</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" id="fechaReserva" class="form-control bg-dark text-light border-secondary" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Hora</label>
                        <input type="time" id="horaReserva" class="form-control bg-dark text-light border-secondary" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold">Confirmar Reserva</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // logica para guardar las reservas
        document.getElementById("formReserva").addEventListener("submit", function(e) {
            e.preventDefault(); // pa que no recargue la pagina

            console.log("procesando form...");
            
            let nombre = document.getElementById("nombreCliente").value;
            var servicio = document.getElementById("tipoServicio").value;
            let fecha = document.getElementById("fechaReserva").value;
            var hora = document.getElementById("horaReserva").value;

            // armo el objeto
            let nuevaReserva = {
                nom: nombre,
                serv: servicio,
                dia: fecha,
                hr: hora
            };

            // sacar las reservas que ya existen en el localstorage
            var baseDatos = localStorage.getItem("listaReservas");
            let arregloReservas = [];
            
            if(baseDatos != null) {
                arregloReservas = JSON.parse(baseDatos);
            }

            arregloReservas.push(nuevaReserva);

            // guardar de vuelta
            localStorage.setItem("listaReservas", JSON.stringify(arregloReservas));

            alert("¡Buena " + nombre + "! Tu hora quedó lista.");
            window.location.href = "index.html"; // lo devuelvo al inicio
        });
    </script>
</body>
</html>
