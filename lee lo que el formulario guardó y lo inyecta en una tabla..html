<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Barbería Urbana Conce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand text-secondary fw-bold" href="index.html">MODO ADMIN</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Volver a la web</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <h2 class="text-light mb-4">Listado de Reservas</h2>
        
        <div class="table-responsive">
            <table class="table table-dark table-striped table-bordered border-secondary">
                <thead>
                    <tr>
                        <th class="text-warning">Cliente</th>
                        <th class="text-warning">Servicio</th>
                        <th class="text-warning">Fecha</th>
                        <th class="text-warning">Hora</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaReservas">
                    <-- aqui se meten las filas con javascript -->
                </tbody>
            </table>
        </div>
        
        <button class="btn btn-outline-danger mt-3" onclick="limpiarTodo()">Borrar todo el registro</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // cargar tabla apenas entra a la pagina
        window.onload = function() {
            console.log("cargando admin...");
            var datosGuardados = localStorage.getItem("listaReservas");
            
            if(datosGuardados) {
                let arreglo = JSON.parse(datosGuardados);
                let cuerpoTabla = document.getElementById("tablaReservas");
                
                // loop pa meter los datos a lo bruto en el HTML
                for(let i=0; i < arreglo.length; i++) {
                    let r = arreglo[i];
                    cuerpoTabla.innerHTML += "<tr>" +
                                             "<td>" + r.nom + "</td>" +
                                             "<td>" + r.serv + "</td>" +
                                             "<td>" + r.dia + "</td>" +
                                             "<td>" + r.hr + "</td>" +
                                             "<td><button class='btn btn-danger btn-sm' onclick='borrarUna()'>X</button></td>" +
                                             "</tr>";
                }
            } else {
                document.getElementById("tablaReservas").innerHTML = "<tr><td colspan='5' class='text-center'>No hay reservas todavia.</td></tr>";
            }
        };

        function borrarUna() {
            // detalle pa que parezca en proceso
            alert("Aún no programo borrar de a una fila profe, use el botón de abajo xd");
        }

        function limpiarTodo() {
            if(confirm("¿Seguro que queri borrar todo el historial?")) {
                localStorage.removeItem("listaReservas");
                location.reload(); // recargar
            }
        }
    </script>
</body>
</html>
